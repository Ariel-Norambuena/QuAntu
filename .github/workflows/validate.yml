name: Validate research collection
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install scientific dependencies
        run: python -m pip install -r requirements-core.txt 'plotly>=5.18,<7'
      - name: Verify imported assets and links
        run: python scripts/verify_repository.py
      - name: Check numerical integrity
        run: python scripts/check_science.py
      - name: Validate density matrix model
        run: python -m unittest discover -s theory/models/density-matrix -p 'test_*.py' -v
      - name: Validate open quantum systems
        run: python -m unittest discover -s theory/models/open-quantum-systems -p 'test_*.py' -v
      - name: Reproduce absorption notebook metrics
        env:
          MPLBACKEND: Agg
        run: python scripts/run_absorption_notebooks.py
  qiskit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r algorithms/education/qiskit/requirements.txt
      - run: python algorithms/education/qiskit/validate_notebook.py
