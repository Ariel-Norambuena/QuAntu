name: Validate research collection
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install scientific dependencies
        run: python -m pip install -r requirements-core.txt 'plotly>=5.18,<7'
      - name: Verify imported assets and links
        run: python scripts/verify_repository.py
      - name: Check numerical integrity
        run: python scripts/check_science.py
      - name: Validate density matrix model
        run: python -m unittest discover -s models/density-matrix -p 'test_*.py' -v
      - name: Validate open quantum systems
        run: python -m unittest discover -s models/open-quantum-systems -p 'test_*.py' -v
      - name: Reproduce absorption notebook metrics
        env:
          MPLBACKEND: Agg
        run: python scripts/run_absorption_notebooks.py
  qiskit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r education/qiskit/requirements.txt
      - run: python education/qiskit/validate_notebook.py
