name: Reproducible bug
description: Report a problem in code, data, or documentation
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Command and reproduction steps
      description: Include the working directory and parameters.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Expected and observed results
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and relevant dependencies. Do not include credentials.
